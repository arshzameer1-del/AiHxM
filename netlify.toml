# Netlify config for the frontend (apps/web) half of a Supabase + Render +
# Netlify test/staging deployment. Lives at the repo root (not inside
# apps/web) because `npm install` needs to run at the monorepo root for
# npm workspaces to link @boostfactor/shared-types — Netlify's own "base
# directory" setting doesn't change where the repo is checked out, so
# root-relative paths here are simpler than fighting that.
#
# What this does NOT need: any change to apps/web/src/api/client.ts. That
# file already calls `fetch('/api${path}')` — a same-origin relative path
# — which is exactly what the redirect below turns into a transparent
# proxy to the real backend, so the browser never sees a cross-origin
# request and CORS_ORIGIN on the API only ever needs to allow this one
# Netlify origin, not itself.

[build]
  command = "npm install && npx turbo run build --filter=@ai-hxm/web"
  publish = "apps/web/dist"

# 1) Proxy every /api/* call to the real NestJS backend (Render). Replace
#    the placeholder host below with your actual Render service URL
#    (Render dashboard > your service > the URL at the top, no trailing
#    slash) once it exists. This rule must come BEFORE the catch-all SPA
#    rule below — Netlify uses the first matching rule.
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE-WITH-YOUR-RENDER-SERVICE.onrender.com/:splat"
  status = 200
  force = true

# 2) Client-side routing (react-router-dom): any other path that isn't a
#    real static file falls through to index.html so the app's own router
#    handles it, instead of Netlify returning a 404 on a hard refresh of
#    e.g. /app/admin.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
