name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boostfactor
          POSTGRES_PASSWORD: boostfactor_dev
          POSTGRES_DB: boostfactor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      # Owner/migration connection — matches docker-compose.yml locally.
      DATABASE_URL: postgresql://boostfactor:boostfactor_dev@localhost:5432/boostfactor?schema=public
      # Request-scoped connection the API runs queries through, once the
      # migration below creates the app_role login (Decision #2 / RLS).
      APP_DATABASE_URL: postgresql://app_role:app_role_dev_password@localhost:5432/boostfactor?schema=public
      JWT_SECRET: ci-only-jwt-secret
      MFA_ENCRYPTION_KEY: ci-only-mfa-encryption-key-32chars-min
      PLATFORM_ADMIN_BOOTSTRAP_EMAIL: ci-admin@boostfactor.dev
      PLATFORM_ADMIN_BOOTSTRAP_PASSWORD: ci-only-bootstrap-password
      PLATFORM_ADMIN_BOOTSTRAP_NAME: CI Platform Admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Apply database migrations
        run: npm run migrate --workspace=@boostfactor/api

      - name: Seed the first Platform Admin (idempotent)
        run: npm run seed --workspace=@boostfactor/api

      - name: Run tests (real Postgres — RLS is the point, not mocked)
        run: npm run test --workspace=@boostfactor/api
