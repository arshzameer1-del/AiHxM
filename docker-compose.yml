version: "3.9"

# Local Phase 1 infrastructure. This stands in for Supabase's managed
# Postgres during local development — the same schema and RLS policies
# will later be applied to the real Supabase project (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    container_name: aihxm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aihxm
      POSTGRES_PASSWORD: aihxm_dev
      POSTGRES_DB: aihxm
    ports:
      - "5432:5432"
    volumes:
      - aihxm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihxm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aihxm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aihxm_redis_data:/data

volumes:
  aihxm_postgres_data:
  aihxm_redis_data:
