<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>AI HXM is offline</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; text-align: center; }
  main { max-width: 22rem; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 1.25rem; margin: 1rem 0 .5rem; }
  p { margin: 0 0 1.25rem; color: #475569; line-height: 1.5; }
  button { font: inherit; font-weight: 600; background: #2563eb; color: #fff; border: 0; border-radius: 10px; padding: .7rem 1.4rem; }
  @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #e2e8f0; } p { color: #94a3b8; } }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" />
  <h1>You are offline</h1>
  <p>AI HXM needs a connection to show your company data. Check your internet and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
